<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="cosmicBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241c47" />
      <stop offset="60%" stop-color="#0d0920" />
      <stop offset="100%" stop-color="#05030f" />
    </radialGradient>
    <radialGradient id="orbGlow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="30%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#3b0764" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circular badge -->
  <circle cx="32" cy="32" r="30" fill="url(#cosmicBg)" stroke="#d4a017" stroke-width="2" />

  <!-- Outer star markings -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#8b5cf6" stroke-width="0.75" stroke-dasharray="2,3" />

  <!-- Pedestal base -->
  <path d="M22 52 C22 47 42 47 42 52 Z" fill="#d4a017" filter="url(#goldGlow)" />
  <rect x="26" y="47" width="12" height="3" rx="1.5" fill="#f0c040" />

  <!-- Crystal Orb -->
  <circle cx="32" cy="30" r="17" fill="url(#orbGlow)" stroke="#c084fc" stroke-width="1.2" />

  <!-- Orb Light reflection -->
  <ellipse cx="27" cy="23" rx="4.5" ry="2.5" fill="#ffffff" opacity="0.6" transform="rotate(-30 27 23)" />

  <!-- Magical sparkles inside orb -->
  <polygon points="32,19 33.5,23.5 38,25 33.5,26.5 32,31 30.5,26.5 26,25 30.5,23.5" fill="#ffd700" />
  <circle cx="37" cy="33" r="1.2" fill="#ffffff" />
  <circle cx="27" cy="34" r="1" fill="#ffffff" />
  <polygon points="39,21 39.8,22.8 41.5,23.5 39.8,24.2 39,26 38.2,24.2 36.5,23.5 38.2,22.8" fill="#f0c040" />
</svg>
